version: '3.8'
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: vanphongpham_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  # THÊM ĐOẠN NÀY NẾU CHƯA CÓ
 # Thay thế đoạn adminer cũ bằng phpmyadmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: flexioffice_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db