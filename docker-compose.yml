version: '3.8'

services:
  web:
    build: .
    container_name: web_van_phong
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: web_van_phong_pham
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./web_van_phong_pham.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  # ĐOẠN ĐÃ CẬP NHẬT GIAO DIỆN PHPMYADMIN TỰ ĐỘNG ĐĂNG NHẬP
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_web
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_ARBITRARY=0
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
      - PMA_AUTH_TYPE=config
    depends_on:
      - db

volumes:
  mysql_data: